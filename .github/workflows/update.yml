name: Update ceru-music-bin from upstream

on:
  schedule:
    - cron: '0 0 * * *' # daily at 00:00 UTC
  workflow_dispatch:

# Avoid two runs racing on the AUR repo
concurrency:
  group: aur-update
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM: timeshiftsauce/CeruMusic
  AUR_PKG: ceru-music-bin
  AUR_BRANCH: master

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git curl jq openssh sudo pacman-contrib

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream latest version
        id: upstream
        run: |
          TAG=$(curl -fsSL "https://api.github.com/repos/${UPSTREAM}/releases/latest" | jq -r '.tag_name // empty')
          if [ -z "$TAG" ]; then
            echo "::error::Could not determine latest upstream tag"
            exit 1
          fi
          VER="${TAG#v}"
          echo "tag=$TAG"        >> "$GITHUB_OUTPUT"
          echo "version=$VER"    >> "$GITHUB_OUTPUT"
          echo "Upstream latest: $TAG (pkgver $VER)"

      - name: Read current pkgver
        id: current
        run: |
          CUR=$(grep -E '^pkgver=' PKGBUILD | head -n1 | cut -d= -f2)
          echo "version=$CUR" >> "$GITHUB_OUTPUT"
          echo "Current pkgver: $CUR"

      - name: Update PKGBUILD and checksums
        if: steps.upstream.outputs.version != steps.current.outputs.version
        env:
          NEW: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail

          # Tools must not run as root; use an unprivileged builder.
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

          # Prepare an isolated, builder-owned working copy.
          rm -rf /tmp/pkg
          install -d -o builder -g builder /tmp/pkg
          cp PKGBUILD /tmp/pkg/PKGBUILD
          chown builder:builder /tmp/pkg/PKGBUILD

          # Bump version, reset pkgrel.
          sed -i "s/^pkgver=.*/pkgver=${NEW}/" /tmp/pkg/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/"     /tmp/pkg/PKGBUILD

          # Recompute checksums (downloads the new upstream artifacts).
          ( cd /tmp/pkg && sudo -H -u builder updpkgsums )

          # Regenerate .SRCINFO.
          ( cd /tmp/pkg && sudo -H -u builder makepkg --printsrcinfo > .SRCINFO )

          # Publish back into the checked-out repo.
          cp /tmp/pkg/PKGBUILD /tmp/pkg/.SRCINFO .

          echo "--- new PKGBUILD version ---"
          grep -E '^(pkgver|pkgrel)=' PKGBUILD

      - name: Push to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
        run: |
          set -euo pipefail

          # SSH setup for AUR (deploy key from repository secrets).
          install -d -m 700 /root/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" | tr -d '\r' > /root/.ssh/aur
          chmod 600 /root/.ssh/aur
          # Fail fast with a clear message if the secret is malformed.
          ssh-keygen -y -f /root/.ssh/aur >/dev/null \
            || { echo "::error::AUR_SSH_PRIVATE_KEY is not a valid unencrypted private key"; exit 1; }
          echo "Deploy key fingerprint: $(ssh-keygen -lf /root/.ssh/aur)"
          ssh-keyscan -H aur.archlinux.org >> /root/.ssh/known_hosts 2>/dev/null
          printf 'Host aur.archlinux.org\n  IdentityFile /root/.ssh/aur\n  User aur\n  IdentitiesOnly yes\n' > /root/.ssh/config

          # AUR has its own history -> clone and commit on top of it.
          rm -rf /tmp/aur
          git clone "ssh://aur@aur.archlinux.org/${AUR_PKG}.git" /tmp/aur

          if [ -f /tmp/pkg/PKGBUILD ]; then
            cp /tmp/pkg/PKGBUILD /tmp/pkg/.SRCINFO /tmp/aur/
          else
            cp PKGBUILD .SRCINFO /tmp/aur/
          fi
          # 版本未变时，pkgrel/补丁类改动也要能同步：与 AUR 现状做内容比对
          cd /tmp/aur
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No changes for AUR; skipping."
            exit 0
          fi
          git -c user.name="${AUR_USERNAME}" -c user.email="${AUR_EMAIL}" \
            commit -m "Update to v$(grep -E '^pkgver=' PKGBUILD | head -n1 | cut -d= -f2)-$(grep -E '^pkgrel=' PKGBUILD | head -n1 | cut -d= -f2)"
          git push origin "${AUR_BRANCH}"

      - name: Commit to GitHub mirror
        if: steps.upstream.outputs.version != steps.current.outputs.version
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          git config user.name  "${{ secrets.AUR_USERNAME }}"
          git config user.email "${{ secrets.AUR_EMAIL }}"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to v${{ steps.upstream.outputs.version }}"
          git push
