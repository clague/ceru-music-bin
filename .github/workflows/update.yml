name: Update from upstream release

on:
  schedule:
    - cron: '0 0 * * *' # daily at UTC 00:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed git curl jq

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get upstream latest version
        id: upstream
        run: |
          UPSTREAM="timeshiftsauce/CeruMusic"
          TAG=$(curl -s "https://api.github.com/repos/${UPSTREAM}/releases/latest" | jq -r '.tag_name')
          if [ "$TAG" = "null" ] || [ -z "$TAG" ]; then
            echo "Failed to fetch latest tag"
            exit 1
          fi
          VER=$(echo "$TAG" | sed 's/^v//')
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Get current pkgver
        id: current
        run: |
          CUR=$(grep -E '^pkgver=' PKGBUILD | cut -d= -f2)
          echo "version=$CUR" >> $GITHUB_OUTPUT

      - name: Update if newer version available
        if: steps.upstream.outputs.version != steps.current.outputs.version
        run: |
          NEW="${{ steps.upstream.outputs.version }}"
          # Update pkgver and reset pkgrel
          sed -i "s/^pkgver=.*/pkgver=${NEW}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          # Update checksums and generate .SRCINFO
          updpkgsums
          makepkg --printsrcinfo > .SRCINFO

      - name: Commit and push changes
        if: steps.upstream.outputs.version != steps.current.outputs.version
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update to v${{ steps.upstream.outputs.version }}"
          file_pattern: 'PKGBUILD .SRCINFO'
